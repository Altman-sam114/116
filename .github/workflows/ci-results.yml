name: WW2Tactics CI Results

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci-results:
    name: Build and package CI results
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare result paths
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          branch_slug="${GITHUB_REF_NAME//\//-}"
          commit_subject="$(git log -1 --pretty=%s)"
          ci_version="unversioned"
          if [[ "$commit_subject" =~ ^(v[0-9]+(\.[0-9]+)?): ]]; then
            ci_version="${BASH_REMATCH[1]}"
          fi

          mkdir -p ci-results
          {
            echo "SHORT_SHA=$short_sha"
            echo "BRANCH_SLUG=$branch_slug"
            echo "CI_VERSION=$ci_version"
            echo "ARTIFACT_NAME=ww2tactics-ci-${ci_version}-${branch_slug}-${short_sha}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
            echo "RESULT_BUNDLE=ci-results/WW2Tactics.xcresult"
            echo "DERIVED_DATA=.derivedData-ci"
            echo "MODULE_CACHE=.module-cache-ci"
            echo "BATTLEFIELD_SCREENSHOT=ci-results/battlefield-screenshot.png"
            echo "SCREENSHOT_LOG=ci-results/battlefield-screenshot.log"
            echo "SCREENSHOT_SCENARIO=selected-combat-impact-steady"
          } >> "$GITHUB_ENV"

      - name: Run checks and build
        shell: bash
        run: |
          set +e
          set -o pipefail

          mkdir -p ci-results "$DERIVED_DATA" "$MODULE_CACHE"

          static_status=0
          smoke_status=0
          build_status=0

          {
            echo "## Static checks"
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              git diff --check HEAD^ HEAD
            else
              git diff --check
            fi
            diff_status=$?
            echo
            plutil -lint WW2Tactics/WW2Tactics.xcodeproj/project.pbxproj
            plutil_status=$?
            echo
            ruby -e 'require "yaml"; YAML.load_file(".github/workflows/ci-results.yml"); puts "yaml ok"'
            yaml_status=$?
            python3 .github/scripts/run_with_timeout.py --self-test > ci-results/timeout-contracts.log 2>&1
            timeout_contract_status=$?
            python3 -m py_compile .github/scripts/ci_simulator.py .github/scripts/ci_package.py
            python_status=$?
            cat ci-results/timeout-contracts.log
            if [[ $diff_status -ne 0 || $plutil_status -ne 0 || $yaml_status -ne 0 || $timeout_contract_status -ne 0 || $python_status -ne 0 ]]; then
              static_status=1
            fi
          } > ci-results/static-checks.log 2>&1

          {
            echo "## Rules smoke test"
            macos_sdk="$(xcrun --sdk macosx --show-sdk-path)"
            python3 .github/scripts/run_with_timeout.py 300 xcrun --sdk macosx swiftc \
              -swift-version 5 \
              -sdk "$macos_sdk" \
              -module-cache-path "$MODULE_CACHE" \
              -parse-as-library \
              WW2Tactics/WW2Tactics/GameModels.swift \
              WW2Tactics/WW2Tactics/GameState.swift \
              WW2Tactics/Tools/RulesSmokeTest.swift \
              -o ci-results/WW2TacticsRulesSmokeTest
            compile_status=$?
            if [[ $compile_status -eq 0 ]]; then
              ci-results/WW2TacticsRulesSmokeTest
              run_status=$?
            else
              run_status=1
            fi
            if [[ $compile_status -ne 0 || $run_status -ne 0 ]]; then
              smoke_status=1
            fi
          } > ci-results/rules-smoke.log 2>&1

          {
            echo "## Xcode"
            xcodebuild -version
            echo
            python3 .github/scripts/run_with_timeout.py 900 xcodebuild \
              -project WW2Tactics/WW2Tactics.xcodeproj \
              -scheme WW2Tactics \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$DERIVED_DATA" \
              -resultBundlePath "$RESULT_BUNDLE" \
              build-for-testing CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES
          } > ci-results/xcodebuild.log 2>&1
          build_status=$?

          {
            echo "STATIC_STATUS=$static_status"
            echo "SMOKE_STATUS=$smoke_status"
            echo "BUILD_STATUS=$build_status"
          } >> "$GITHUB_ENV"

      - name: Execute unit and landscape UI tests and capture six battlefield scenes
        if: always()
        shell: bash
        run: python3 .github/scripts/ci_simulator.py

      - name: Generate result package metadata
        if: always()
        shell: bash
        run: python3 .github/scripts/ci_package.py

      - name: Upload CI result package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ci-results/*.json
            ci-results/*.md
            ci-results/*.xml
            ci-results/*.log
            ci-results/*.png
            ci-results/*.xcresult
          if-no-files-found: error
          retention-days: 14

      - name: Fail when checks failed
        if: always()
        shell: bash
        run: |
          if [[ "${STATIC_STATUS:-1}" != "0" || "${SMOKE_STATUS:-1}" != "0" || "${BUILD_STATUS:-1}" != "0" || "${SCREENSHOT_STATUS:-1}" != "0" || "${TEST_STATUS:-1}" != "0" || "${UI_TEST_STATUS:-1}" != "0" ]]; then
            exit 1
          fi
